[package]
name = "hey-postie"
version = "0.1.0"
description = "A friendly XMPP chat client, end-to-end encrypted."
authors = ["Snouzylabs S.R.L. and the Hey Postie contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[lib]
name = "hey_postie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
keyring = "4"
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-tungstenite = "0.30.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
hickory-resolver = "0.26.3"
quick-xml = "0.42.0"
rand = "0.10.3"
log = "0.4.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
sys-locale = "0.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
percent-encoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rustls-platform-verifier = "0.7.1"

# Already in the tree through tauri-plugin-notification; used directly to claim the app's identity
# for dev notifications (see src/notification_identity.rs).
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4.18"

[dev-dependencies]
proptest = "1.12.0"
rcgen = "0.14"
